version: "3.9"

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: civicpulse-db
    environment:
      POSTGRES_DB: civicpulse
      POSTGRES_USER: civicpulse
      POSTGRES_PASSWORD: civicpulse
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U civicpulse"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
